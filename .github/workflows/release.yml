name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Write google-services.json from GitHub secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_B64 secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      # The release keystore is not in version control. It is restored from
      # secrets into the runner's workspace, which is ephemeral, and the
      # signing values are written to the gitignored keystore/signing.properties
      # that app/build.gradle.kts reads. A file input keeps Gradle's
      # configuration cache honest, unlike System.getenv at configuration time.
      - name: Restore release keystore from GitHub secret
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_FILE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing keystore secrets. Set KEYSTORE_FILE_B64, KEYSTORE_PASSWORD and KEY_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_FILE_B64" | base64 --decode > keystore/release-ci.jks
          chmod 600 keystore/release-ci.jks
          umask 077
          {
            echo "storeFile=keystore/release-ci.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=workoutapp"
          } > keystore/signing.properties

      # Gate builds (and therefore releases) on the full unit suite.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-xml
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload unit test report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-html
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Required before any Gradle invocation: the Google Services plugin fails
      # configuration when app/google-services.json is missing. The file is
      # gitignored, so it never shows up as a dirty file to Axion's verifyRelease.
      - name: Write google-services.json from GitHub secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_B64 secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      # The release job runs Axion, which invokes Gradle, so it needs the same
      # keystore restore as the build job. Each job gets a fresh checkout.
      - name: Restore release keystore from GitHub secret
        env:
          KEYSTORE_FILE_B64: ${{ secrets.KEYSTORE_FILE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_FILE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing keystore secrets. Set KEYSTORE_FILE_B64, KEYSTORE_PASSWORD and KEY_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_FILE_B64" | base64 --decode > keystore/release-ci.jks
          chmod 600 keystore/release-ci.jks
          umask 077
          {
            echo "storeFile=keystore/release-ci.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=workoutapp"
          } > keystore/signing.properties

      - name: Compute next version from conventional commits
        id: version
        run: |
          NEXT=$(bash scripts/next-version.sh)
          echo "Next version: $NEXT"
          echo "VERSION=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create and push tag with Axion
        if: steps.version.outputs.VERSION != 'none'
        run: ./gradlew release -Prelease.version=${{ steps.version.outputs.VERSION }} -Prelease.pushTags=true --console=plain

      - name: Download Release APK
        if: steps.version.outputs.VERSION != 'none'
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./artifacts

      - name: Download Release APK
        if: steps.version.outputs.VERSION != 'none'
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./artifacts

      # Deploy Firebase Storage and Firestore rules on releases. The
      # project_id is pulled from the regenerated google-services.json so
      # the value isn't hardcoded in YAML; auth uses a Firebase CI token.
      - name: Deploy Firebase Storage and Firestore rules
        if: steps.version.outputs.VERSION != 'none'
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_B64 secret" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN secret" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          PROJECT_ID=$(grep -oE '"project_id"[[:space:]]*:[[:space:]]*"[^"]+"' app/google-services.json | head -n1 | sed -E 's/.*"project_id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not extract project_id from google-services.json" >&2
            exit 1
          fi
          echo "Deploying storage and firestore rules to Firebase project: $PROJECT_ID"
          npx firebase-tools@latest deploy --only storage,firestore:rules --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive

      - name: Extract changelog for this version
        id: changelog
        if: steps.version.outputs.VERSION != 'none'
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk -v ver="## [${VERSION}]" '
            index($0, ver) { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md || true)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(awk -v ver="## [Unreleased]" '
              index($0, ver) { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See the commit history for details."
          fi

          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.VERSION != 'none'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Workout Tracker v${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Downloads
            - **app-release.apk**: Release build (signed)

            The debug APK is no longer published. It shared the package name and
            signing key with the release build, so installing it would silently
            downgrade a real install to a debuggable, unminified app.

            ### Installation
            Download the APK and install on your Android device.
            You may need to enable "Install from Unknown Sources" in your device settings.
          files: |
            ./artifacts/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
