name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Write google-services.json from GitHub secret
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_B64 secret"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          path: ./artifacts
      
      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: ./artifacts
      
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG=$(awk -v ver="## [${VERSION}]" '
            index($0, ver) { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md || true)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(awk -v ver="## [Unreleased]" '
              index($0, ver) { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md || true)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See the commit history for details."
          fi

          {
            echo 'CHANGELOG<<EOF'
            echo "$CHANGELOG"
            echo EOF
          } >> $GITHUB_OUTPUT

      # Deploy Firebase Storage rules on tagged releases. The project_id is
      # pulled from the regenerated google-services.json so the value isn't
      # hardcoded in YAML; auth uses a Firebase CI token.
      - name: Deploy Firebase Storage rules
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "Missing GOOGLE_SERVICES_JSON_B64 secret" >&2
            exit 1
          fi
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "Missing FIREBASE_TOKEN secret" >&2
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
          PROJECT_ID=$(grep -oE '"project_id"[[:space:]]*:[[:space:]]*"[^"]+"' app/google-services.json | head -n1 | sed -E 's/.*"project_id"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not extract project_id from google-services.json" >&2
            exit 1
          fi
          echo "Deploying storage rules to Firebase project: $PROJECT_ID"
          npx firebase-tools@latest deploy --only storage --project "$PROJECT_ID" --non-interactive

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Workout Tracker v${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Downloads
            - **app-debug.apk**: Debug build for testing
            - **app-release-unsigned.apk**: Release build (unsigned)

            ### Installation
            Download the APK and install on your Android device.
            You may need to enable "Install from Unknown Sources" in your device settings.
          files: |
            ./artifacts/app-debug.apk
            ./artifacts/app-release-unsigned.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
